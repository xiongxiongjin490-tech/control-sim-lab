[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-sim-lab"
version = "0.1.0"
description = "Discrete PID step-response simulation and auditable control-metric comparison"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
control-sim = "control_sim_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["control_sim_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
